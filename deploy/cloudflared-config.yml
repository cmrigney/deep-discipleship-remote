# /opt/dd-remote/cloudflared/config.yml on the Raspberry Pi.
# Replace <tunnel-id> and the hostname. See README.md "Cloudflare Tunnel".
tunnel: <tunnel-id>
# `cloudflared tunnel create` writes this file to ~/.cloudflared/; copy it into
# /opt/dd-remote/cloudflared/ (README §2). The path below is inside the container.
credentials-file: /etc/cloudflared/<tunnel-id>.json

ingress:
  - hostname: dd-remote.example.com
    service: http://relay:8080
  - service: http_status:404
